<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>ERRATE NUMMER</header>
  <div class="container">
    <h1 id="headlinee">Bitte rate die Zahl!</h1>
    <div class="tipps">
    <h3>Tipps:</h3>
      <ul>
        <p id="headline">Die Zahlen sind zwischen 0 und 100</p>
        <p id="tipp1">Du hast beliebig viele Versuche</p>
        <p id="tipp2">Nutze die Tipps die du bekommst</p>
      </ul>
    </div>
    <h2 id="displayTries">Versuche: 0</h2>
    <div class="buttons">
    <form onsubmit="guessTheNumber(); return false;">
      <input id="myNumber" type="number" required placeholder="Bitte Zahl eingeben...">
      <button>Raten</button>
    </form>
    <button id="restart" class="restart" onclick="reset();">Restarten</button>
    </div>
  </div>
<script src="script.js"></script><script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>

<footer>
  <div class="footer">Created by Amar Muric©</div>
</footer>



</body>
</html>
